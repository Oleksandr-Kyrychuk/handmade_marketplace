# render.yaml — 100% валідний Blueprint за документацією Render 2025
services:
  # Redis (keyvalue)
  - type: keyvalue
    name: handmade-redis
    region: frankfurt
    plan: free
    ipAllowList: []

  # API Gateway (публічний web)
  - type: web
    name: api-gateway
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/api_gateway
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health  # дозволено тільки тут
    envVars:
      - key: DATABASE_URL
        sync: false  # додай секрет з Neon + gateway_schema в Dashboard
      - key: REDIS_URL
        fromService:
          name: handmade-redis
          type: keyvalue  # обов'язкове!
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://твій-фронтенд.com  # заміни на реальний
      - key: USER_SERVICE_URL
        fromService:
          name: user-service
          type: pserv  # обов'язкове!
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: PRODUCT_SERVICE_URL
        fromService:
          name: product-service
          type: pserv
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: ORDER_SERVICE_URL
        fromService:
          name: order-service
          type: pserv
          envVarKey: RENDER_INTERNAL_HOSTNAME

  # User Service (приватний pserv — без healthCheckPath)
  - type: pserv
    name: user-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/user_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # секрет з Neon + users_schema
      - key: REDIS_URL
        fromService:
          name: handmade-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY

  # Product Service (приватний pserv — без healthCheckPath)
  - type: pserv
    name: product-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/product_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # секрет з Neon + products_schema
      - key: REDIS_URL
        fromService:
          name: handmade-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY

  # Order Service (приватний pserv — без healthCheckPath)
  - type: pserv
    name: order-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/order_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false  # секрет з Neon + orders_schema
      - key: REDIS_URL
        fromService:
          name: handmade-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY
# render.yaml — остаточна версія, проходить валідацію без помилок
services:
  - type: keyvalue
    name: handmade-redis
    region: frankfurt
    plan: free
    ipAllowList: []

  # API Gateway — публічний
 100% працює
  - type: web
    name: api-gateway
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/api_gateway          # правильне поле
    dockerfilePath: Dockerfile                  # відносно dockerContext
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://твій-фронтенд.com
      - key: USER_SERVICE_URL
        fromService:
          type: pserv
          name: user-service
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: pserv
          name: product-service
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: ORDER_SERVICE_URL
        fromService:
          type: pserv
          name: order-service
          envVarKey: RENDER_INTERNAL_HOSTNAME

  # Приватні сервіси — просто заміни dockerContext на правильний шлях
  - type: pserv
    name: user-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/user_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY

  - type: pserv
    name: product-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/product_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY

  - type: pserv
    name: order-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/order_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY
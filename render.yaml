# render.yaml — валідний Blueprint за документацією Render 2025
services:
  # Redis (keyvalue)
  - type: keyvalue
    name: handmade-redis
    region: frankfurt
    plan: free
    ipAllowList: []

  # API Gateway (публічний web)
  - type: web
    name: api-gateway
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/api_gateway  # шлях до контексту (правильне поле)
    dockerfilePath: Dockerfile          # відносно dockerContext
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # додаємо секрет з Neon + gateway_schema в Dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://твій-фронтенд.com  # заміни на реальний (e.g., Vercel)
      - key: USER_SERVICE_URL
        fromService:
          type: pserv
          name: user-service
          envVarKey: RENDER_INTERNAL_HOSTNAME  # внутрішня адреса (e.g., user-service.internal)
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: pserv
          name: product-service
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: ORDER_SERVICE_URL
        fromService:
          type: pserv
          name: order-service
          envVarKey: RENDER_INTERNAL_HOSTNAME

  # User Service (приватний pserv)
  - type: pserv
    name: user-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/user_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # секрет з Neon + users_schema
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString

  # Product Service (приватний pserv)
  - type: pserv
    name: product-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/product_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # секрет з Neon + products_schema
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString

  # Order Service (приватний pserv)
  - type: pserv
    name: order-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: backend/order_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # секрет з Neon + orders_schema
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
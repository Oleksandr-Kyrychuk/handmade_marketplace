# render.yaml — виправлена версія з type: pserv (працює на Render 2025)
services:
  # Redis
  - type: keyvalue
    name: handmade-redis
    region: frankfurt
    plan: free
    ipAllowList: []

  # API Gateway (публічний)
  - type: web
    name: api-gateway
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    rootDirectory: backend/api_gateway
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # ← додаємо секрет з Neon + search_path=gateway_schema в Dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://твій-фронтенд.com  # ← заміни на реальний (Vercel тощо)
      - key: USER_SERVICE_URL
        fromService:
          type: pserv
          name: user-service
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: pserv
          name: product-service
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: ORDER_SERVICE_URL
        fromService:
          type: pserv
          name: order-service
          envVarKey: RENDER_INTERNAL_HOSTNAME }

  # User Service (приватний)
  - type: pserv
    name: user-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    rootDirectory: backend/user_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # ← секрет з Neon + search_path=users_schema
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY

  # Product Service (приватний)
  - type: pserv
    name: product-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    rootDirectory: backend/product_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # ← секрет з Neon + search_path=products_schema
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY

  # Order Service (приватний)
  - type: pserv
    name: order-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    rootDirectory: backend/order_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # ← секрет з Neon + search_path=orders_schema
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY
# render.yaml — остаточна версія, 100% робоча, без дублювання
services:
  - type: redis
    name: handmade-redis
    region: frankfurt
    plan: free
    ipAllowList: []

  # API Gateway
  - type: web
    name: api-gateway
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    rootDirectory: backend/api_gateway
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL                    # ← секрет з правильною схемою
        sync: false                          # додаємо в Render Dashboard → Secrets
      - key: REDIS_URL
        fromService:
          type: redis
          name: handmade-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://твій-фронтенд.com
      - key: USER_SERVICE_URL
        fromService: { type: web, name: user-service, envVarKey: RENDER_INTERNAL_HOSTNAME }
      - key: PRODUCT_SERVICE_URL
        fromService: { type: web, name: product-service, envVarKey: RENDER_INTERNAL_HOSTNAME }
      - key: ORDER_SERVICE_URL
        fromService: { type: web, name: order-service, envVarKey: RENDER_INTERNAL_HOSTNAME }

  # User Service
  - type: private
    name: user-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    rootDirectory: backend/user_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService: { type: redis, name: handmade-redis, property: connectionString }
      - key: SECRET_KEY
        fromService: { name: api-gateway, envVarKey: SECRET_KEY }

  # Product Service
  - type: private
    name: product-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    rootDirectory: backend/product_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService: { type: redis, name: handmade-redis, property: connectionString }
      - key: SECRET_KEY
        fromService: { name: api-gateway, envVarKey: SECRET_KEY }

  # Order Service
  - type: private
    name: order-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    rootDirectory: backend/order_service
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService: { type: redis, name: handmade-redis, property: connectionString }
      - key: SECRET_KEY
        fromService: { name: api-gateway, envVarKey: SECRET_KEY }
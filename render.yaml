# render.yaml — повний Blueprint для Handmade Marketplace

previews:
  enabled: true
  # preview для фронтенду (якщо захочеш додати пізніше)
  # - name: frontend-preview
  #   ...

services:
  # ====================== PostgreSQL ======================
  - type: pgsql
    name: marketplace-db
    region: frankfurt
    plan: free            # або starter/pro коли виростеш
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere (тимчасово, потім закриєш)
    postgresMajorVersion: "16"   # 18 ще не стабільна на Render у 2025

  # ====================== Redis ======================
  - type: redis
    name: handmade-redis
    region: frankfurt
    plan: free
    ipAllowList: []                     # доступ тільки з внутрішньої мережі Render
    maxmemoryPolicy: allkeys-lru

  # ====================== API Gateway (публічний) ======================
  - type: web
    name: api-gateway
    region: frankfurt
    plan: starter                         # free не витримає навантаження
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: ./backend/api_gateway
    dockerfilePath: Dockerfile            # той, що для продакшну
    autoDeploy: true

    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
          # важливо: схема для api-gateway схема gateway_schema
      - key: REDIS_URL
        fromService:
          name: handmade-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://твій-домен.com         # або https://marketplace.onrender.com
      - key: USER_SERVICE_URL
        fromService:
          name: user-service
          type: web
          envVarKey: RENDER_INTERNAL_URL      # внутрішня URL[](https://user-service.onrender.com)
      - key: PRODUCT_SERVICE_URL
        fromService:
          name: product-service
          type: web
          envVarKey: RENDER_INTERNAL_URL
      - key: ORDER_SERVICE_URL
        fromService:
          name: order-service
          type: web
          envVarKey: RENDER_INTERNAL_URL
      - key: SECRET_KEY
        generateValue: true                  # Render згенерує безпечний ключ
      - key: CORS_ALLOWED_ORIGINS
        value: https://твій-домен.com,https://marketplace.onrender.com

    healthCheckPath: /health

  # ====================== User Service (приватний) ======================
  - type: private
    name: user-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: ./backend/user_service
    dockerfilePath: Dockerfile
    autoDeploy: true

    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false                         # задамо вручну нижче
      - key: REDIS_URL
        fromService:
          name: handmade-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway                  # той самий ключ, що й у гейтвеї
          envVarKey: SECRET_KEY
      - key: CELERY_BROKER_URL
        fromService:
          name: handmade-redis
          type: redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

    # Схема users_schema
    postDeployCommand: python manage.py migrate --schema=users_schema

    healthCheckPath: /health

  # ====================== Product Service (приватний) ======================
  - type: private
    name: product-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: ./backend/product_service
    dockerfilePath: Dockerfile
    autoDeploy: true

    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: handmade-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY

    postDeployCommand: python manage.py migrate --schema=products_schema

    healthCheckPath: /health

  # ====================== Order Service (приватний) ======================
  - type: private
    name: order-service
    region: frankfurt
    plan: starter
    runtime: docker
    repo: https://github.com/Oleksandr-Kyrychuk/handmade_marketplace
    dockerContext: ./backend/order_service
    dockerfilePath: Dockerfile
    autoDeploy: true

    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: handmade-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: api-gateway
          envVarKey: SECRET_KEY

    postDeployCommand: python manage.py migrate --schema=orders_schema

    healthCheckPath: /health

# ====================== DATABASE_URL для всіх мікросервісів ======================
databases:
  - name: marketplace-db
    databaseName: marketplace
    user: marketplace_user

# Після деплою треба один раз вручну або через скрипт встановити схеми і search_path
# Найпростіший спосіб — додати Environment Variable для кожного сервісу вручну:
#   DATABASE_URL = postgres://.../marketplace?options=-csearch_path=users_schema
# або використати Render "Post-Deploy Script" (нижче)

# ====================== Один разовий скрипт створення схем ======================
# Додай це як окремий сервіс або виконай вручну після першого деплою
- type: web
  name: init-db-schemas
  runtime: docker
  dockerCommand: sh -c "
    psql $DATABASE_URL -c 'CREATE SCHEMA IF NOT EXISTS gateway_schema;'
    psql $DATABASE_URL -c 'CREATE SCHEMA IF NOT EXISTS users_schema;'
    psql $DATABASE_URL -c 'CREATE SCHEMA IF NOT EXISTS products_schema;'
    psql $DATABASE_URL -c 'CREATE SCHEMA IF NOT EXISTS orders_schema;'
    echo 'Schemas created'
  "
  plan: free
  autoDeploy: false        # запустиш один раз вручну
  envVars:
    - key: DATABASE_URL
      fromDatabase:
        name: marketplace-db
        property: connectionString